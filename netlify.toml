[build]
  # `verify` first: typecheck, lint and the whole suite, then the build. The
  # GitHub Action runs the same checks — but it runs *alongside* the deploy,
  # not before it: a push to main started Netlify's build in the same second,
  # and a red run stopped nothing (docs/DECISIONS.md). With the suite in the
  # build command a failing test cannot ship; the build fails and Netlify
  # keeps serving the last deploy that passed, which is the safe failure.
  command = "npm run verify && npm run build"
  publish = "dist"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  # Pinned, not left to Netlify's default. Vite 8 and TypeScript 6 need a modern
  # Node, and a site defaulting to Node 18 fails `npm run build` — at which point
  # Netlify silently keeps serving the last deploy that worked, so the site looks
  # fine while being weeks out of date. 22 is what this project is built and
  # tested against locally.
  NODE_VERSION = "22"

  # Install devDependencies. Under NODE_ENV=production `npm ci` prunes them, and
  # every tool this build needs — vite, tsc, the @types packages, the Netlify
  # type packages — is a devDependency, so the build dies on "cannot find
  # module". Reproduced exactly with `NODE_ENV=production npm ci` on a clean
  # clone; this flag is what makes it pass.
  NPM_FLAGS = "--include=dev"

# A single-page app: every path that isn't a real file or a function is the app.
# Kept below the automatic /.netlify/functions/* handling.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

# Every page, every file. None of these existed until 2026-09-23 (docs/SECURITY.md,
# O7). The one that matters most is framing: "Forget me" is two taps, and a page
# that could frame this one could put both taps under a member's finger without
# her seeing the words. The rest are the ordinary floor — no type sniffing, no
# full URL in a Referer to another site (a `?map=` code is the whole map), HTTPS
# remembered, and no camera, microphone or location asked for by anything.
# Function responses are JSON the page itself fetches; these rules are for what
# a browser renders.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# The offline shell's own script must never be cached — a browser holding an
# old sw.js past its check-for-updates window is a browser that cannot pick
# up a fix to the shell itself. Every hashed asset it caches through Cache
# Storage is unaffected; this header is only about the one file that decides
# what those caches hold (src/lib/serviceWorker.ts, docs/DESIGN.md).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# There is deliberately no X-Robots-Tag here.
#
# Until 2026-09-13 every path carried `noindex, nofollow` and public/robots.txt
# disallowed everything, so that the founding preview could not be found. The
# two settings cancelled each other: robots.txt stopped the crawl, so the
# noindex was never read, so the domain stayed listed — as a bare URL under
# "No information is available for this page", which reads to a stranger as a
# site that is broken or hiding something. Meanwhile a different Niyyah, a
# Muslim matchmaking service in Toronto and Montreal, held the name in search
# with a real title and description (docs/DECISIONS.md, the search pass).
#
# Being absent from Google requires the opposite of what it looks like: let the
# crawler in, and let the page tell it what to do. robots.txt and sitemap.xml
# are written by vite.config.ts so they carry the same host as every link, and
# index.html's canonical tag keeps ?read, ?eleven and ?via= from being indexed
# as separate thin pages. The tools at /tools/* are real files, written from
# index.html at build with their own head, and the rewrite below yields to them.

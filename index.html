<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- maximum-scale=1.0 used to sit here, blocking pinch-zoom for
         everyone — a WCAG 1.4.4 regression with no offsetting benefit once
         every form field is at least 16px (docs/MOBILE.md), which is the
         actual reason a phone browser zooms on focus. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16271f" />
    <meta name="theme-color" content="#16271f" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="%BRAND_DESCRIPTION%"
    />
    <!-- Standalone (add-to-home-screen) so the app runs full-screen, chrome-free. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Niyyah" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="Niyyah" />
    <meta
      property="og:description"
      content="%BRAND_TAGLINE%"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Niyyah" />
    <!-- Every path serves this same document, so every path is the same page —
         except the tools, which get a copy of this file with their own head at
         build time (vite.config.ts, src/data/tools.ts). Without this, a ?read or
         ?via= link pasted into a group chat becomes a separate thin result
         competing with the real one. -->
    <link rel="canonical" href="https://%SITE_HOST%/" />
    <meta property="og:url" content="https://%SITE_HOST%/" />
    <meta property="og:image" content="https://%SITE_HOST%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="%BRAND_OG_ALT%"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Niyyah" />
    <meta
      name="twitter:description"
      content="%BRAND_TAGLINE%"
    />
    <meta name="twitter:image" content="https://%SITE_HOST%/og.png" />
    <!-- The brand strings above and this title are filled from src/data/brand.ts by vite.config.ts. -->
    <title>%BRAND_TITLE%</title>
  </head>
  <body>
    <!-- The Netlify form declaration lives in public/__forms.html, not here —
         see that file for why posting to "/" would lose signups. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

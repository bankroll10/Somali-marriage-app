<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <meta name="theme-color" content="#16271f" />
    <meta
      name="description"
      content="The trusted marriage platform for the Somali diaspora — powered by AI, guided by faith, designed for serious people."
    />
    <!-- Standalone (add-to-home-screen) so the app runs full-screen, chrome-free. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Niyyah" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="Niyyah" />
    <meta
      property="og:description"
      content="Find someone serious — without losing your dignity, faith, time, or peace."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Niyyah — the trusted marriage platform for the Somali diaspora</title>
  </head>
  <body>
    <!--
      Netlify registers a form by scanning the deployed HTML at build time, and
      the app's real form is rendered by React so it is never in that HTML. This
      hidden declaration is what makes the form exist; src/lib/waitlist.ts posts
      to it. Fields must match WaitlistEntry.
    -->
    <form name="niyyah-waitlist" data-netlify="true" hidden>
      <input type="email" name="email" />
      <input type="text" name="scene" />
      <input type="text" name="gender" />
      <input type="text" name="overall" />
      <input type="text" name="at" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

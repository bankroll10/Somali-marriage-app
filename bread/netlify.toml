[build]
  # Apply any new database migration before building. This is a plain script
  # against DATABASE_URL, not Netlify's own database feature (unavailable on
  # this account's plan — see docs/BUILD_STATUS.md). With no DATABASE_URL it
  # skips cleanly on a local or preview build, but FAILS a production build:
  # a production deploy that never migrated is broken at runtime and silent
  # at deploy time. It also fails if DATABASE_URL is set and migrating fails.
  # DATABASE_URL must not be marked "contains secret values" in Netlify —
  # secret variables are withheld from the build, which reads to this script
  # exactly like an unset one.
  command = "npm run db:migrate && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Vite 8 and TypeScript 6 need a modern Node; Netlify's default is older.
  NODE_VERSION = "22"
  # Every build tool is a devDependency. Under NODE_ENV=production `npm ci`
  # prunes them and the build dies on "cannot find module".
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"
  # The functions import from ../lib and ../../shared; esbuild follows those.
  included_files = []

# Friendly API paths. Stripe's webhook is configured against /api/stripe-webhook.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# A single-page app: every other path is the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

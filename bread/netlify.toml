[build]
  # Apply any new database migration before building. This is a plain script
  # against DATABASE_URL, not Netlify's own database feature (unavailable on
  # this account's plan — see docs/BUILD_STATUS.md). With no DATABASE_URL it
  # skips cleanly on a local or preview build, but FAILS a production build:
  # a production deploy that never migrated is broken at runtime and silent
  # at deploy time. It also fails if DATABASE_URL is set and migrating fails.
  # DATABASE_URL must not be marked "contains secret values" in Netlify —
  # secret variables are withheld from the build, which reads to this script
  # exactly like an unset one.
  command = "npm run db:migrate && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Vite 8 and TypeScript 6 need a modern Node; Netlify's default is older.
  NODE_VERSION = "22"
  # Every build tool is a devDependency. Under NODE_ENV=production `npm ci`
  # prunes them and the build dies on "cannot find module".
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"
  # The functions import from ../lib and ../../shared; esbuild follows those.
  included_files = []

# Friendly API paths. Stripe's webhook is configured against /api/stripe-webhook.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# A single-page app: every other path is the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Caching. There is no service worker, so nothing can serve stale stock offline;
# these keep the HTML fresh across deploys, keep the two pages that carry an
# order or her admin out of any shared cache, and let the hashed assets live
# forever. Every /api/* response sets Cache-Control: no-store on its own.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # A year of HTTPS-only for browsers that have seen the site once. Netlify
    # serves the site over HTTPS only, so there is nothing to lose by saying so.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Scripts and API calls from this origin only; the two Google Fonts hosts
    # for the type; nothing may frame the page. Inline styles are allowed
    # because React sets a handful of style attributes (the print sheet, the
    # safe-area padding); no inline script is, which is the part that matters.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/thanks*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

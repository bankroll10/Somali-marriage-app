# The Guide and relationship judgment against the live model, with an
# outcome that is written down (docs/GUIDE-EVAL.md, "Outcomes").
#
# The offline half of the evaluation runs inside `npm run verify` on every
# pull request and needs no key (tests/guide-eval.test.ts, tests/judgment/*).
# This is the paid half: the Guide eval (tests/guide-eval-live.test.ts, about
# $4 a run) and relationship judgment (tests/judgment-live.test.ts). It runs
# on every pull request so that a check exists for every one, and decides
# from the diff which suites the change requires (tests/eval/outcome.ts,
# REQUIRES): a change to nothing a suite measures is `not-required` and costs
# nothing; a change to the prompt, the Guide, the offline voice, the cases or
# the harnesses runs the suite, and the check passes only on
# `evaluated-pass` — every case answered by the live model, every one
# judged, every gate clean. No key, no credit, a stopped run or a partial
# one is not a pass, and the last step says so rather than warning and
# exiting 0 as this workflow did until 2026-09-27.
#
# Each suite writes its own outcome file; the last step reads both, always
# runs, and fails closed on anything missing, malformed or contradictory.
# Whether a red check blocks a merge is decided by branch protection, not
# here (docs/GUIDE-EVAL.md, "What a red check means").
name: guide-eval

on:
  workflow_dispatch:
    inputs:
      suites:
        description: Which suites this run must complete. A run by hand has no diff to read, so it is required for what you ask.
        type: choice
        options: [both, guide, judgment]
        default: both
  pull_request:

concurrency:
  group: guide-eval-${{ github.ref }}
  cancel-in-progress: true

# Reads the repository and nothing else (docs/SECURITY.md, O10).
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Which suites this change requires, from the files it touches. A
      # manual run has no pull request: it is required for the suites asked.
      # The step writes `not-required` for the rest, so the last step finds
      # a file for every suite. Runs before `npm ci`: tests/eval/check.ts
      # has no dependencies.
      - name: Decide which suites this change requires
        id: which
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SUITES: ${{ github.event.inputs.suites }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA" HEAD > changed.txt
            node --experimental-strip-types --disable-warning=ExperimentalWarning tests/eval/check.ts applicability \
              --event pull_request --changed changed.txt --github-output "$GITHUB_OUTPUT"
          else
            node --experimental-strip-types --disable-warning=ExperimentalWarning tests/eval/check.ts applicability \
              --event dispatch --suites "${SUITES:-both}" --github-output "$GITHUB_OUTPUT"
          fi

      - name: Install
        id: install
        if: steps.which.outputs.guide == 'required' || steps.which.outputs.judgment == 'required'
        run: npm ci

      # Without the secret the suite records not-evaluated and fails: a live
      # run was required and did not happen. The session owns retries, stops
      # on a fatal authentication or billing failure, and keeps what it
      # completed (tests/eval/session.ts).
      - name: Evaluate the live Guide
        if: steps.which.outputs.guide == 'required'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run eval:guide

      # Runs after the Guide suite whatever it did. It reads the Guide's
      # outcome first: a fatal stop there (the key refused, no credit) means
      # this suite sends nothing and records not-evaluated.
      - name: Judge relationship judgment
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.which.outputs.judgment == 'required' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_UPSTREAM_OUTCOME: tests/guide-eval/results/outcome.json
        run: npm run eval:judgment

      # The outcomes and the reports, in the log, for a reader that cannot
      # fetch artifacts: a cloud session's network policy can refuse the
      # artifact store while the log stays readable. Outcomes are printed
      # plain; reports gzipped and base64'd, one marked line per chunk;
      # reassemble with `grep GUIDE_EVAL_REPORT | cut -d' ' -f3 | tr -d '\n' | base64 -d | gunzip`.
      # The cases are written for the suite; no member's words are in it.
      - name: Print the outcomes and reports into the log
        if: always()
        run: |
          for f in tests/guide-eval/results/outcome.json tests/judgment/results/outcome.json; do
            [ -f "$f" ] || { echo "$f: not written"; continue; }
            echo "== $f"; cat "$f"; echo
          done
          for f in tests/guide-eval/results/live-*.json tests/judgment/results/live-*.json; do
            [ -f "$f" ] || continue
            gzip -c "$f" | base64 -w 0 | fold -w 3000 | sed "s|^|GUIDE_EVAL_REPORT $(basename "$f") |"
            echo
          done

      # The reports a person reads, with every answer that lost points quoted.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-eval
          path: |
            tests/guide-eval/results/
            tests/judgment/results/
          retention-days: 14
          if-no-files-found: ignore

      # Always runs, last. Reads both outcome files against what the first
      # step required, and fails unless every required suite is
      # evaluated-pass and nothing is missing, malformed or contradictory
      # (tests/eval/outcome.ts `verdict`). A suite that was not required
      # and still shows evaluated-fail fails it too.
      - name: The outcome
        if: always()
        run: |
          node --experimental-strip-types --disable-warning=ExperimentalWarning tests/eval/check.ts verdict \
            --guide "${{ steps.which.outputs.guide }}" --judgment "${{ steps.which.outputs.judgment }}"

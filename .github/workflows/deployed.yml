# Did the deploy land? (docs/OPS.md)
#
# Netlify builds main on its own, and a build that fails — verify red, a
# broken bundle, a Netlify outage — leaves the last good deploy live and
# says so only in Netlify's own dashboard. This asks the site. Every build
# writes /version.json with the commit it was built from (vite.config.ts);
# after a push to main, this waits up to fifteen minutes for the live site
# to say that commit. If it never does, the job fails, and GitHub emails the
# founder with both commits — the one that is live and the one that is not.
# No Netlify token: the site is asked the same way a visitor would ask it.
#
# Landing is not working. Once the commit is live, a smoke test asks three
# things a broken deploy would get wrong: does the page carry the app, does
# the function runtime answer (an unauthenticated /health is a 401, not a
# 404 or a 500), and can a public route read storage (a restore of a code
# nobody holds answers "not found" — a 404 it could only give after asking
# the store; a store that cannot answer is a 503). A
# failure names the rollback — Netlify → Deploys → the last green deploy →
# Publish deploy (docs/DEPLOY.md, "Rolling back"; docs/RECOVERY.md).
name: deployed

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SITE: ${{ vars.SITE_URL || 'https://joinniyyah.com' }}

permissions:
  contents: read

# A newer push supersedes the wait for an older one: only the latest commit
# can ever be live, so only its check means anything.
concurrency:
  group: deployed
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the live site to say this commit
        env:
          WANT: ${{ github.sha }}
        run: |
          set -u
          live=""
          for i in $(seq 1 30); do
            live=$(curl -sS "$SITE/version.json?check=$i" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$live" = "$WANT" ]; then
              echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
              echo "\`$WANT\` is live on $SITE after about $(( (i - 1) * 30 )) seconds." >> "$GITHUB_STEP_SUMMARY"
              broken=""
              page=$(curl -sS -o page.html -w '%{http_code}' "$SITE/" || echo 000)
              if [ "$page" != "200" ] || ! grep -q 'id="root"' page.html; then broken="$broken the page answered $page without the app;"; fi
              fn=$(curl -sS -o /dev/null -w '%{http_code}' "$SITE/.netlify/functions/health" || echo 000)
              if [ "$fn" != "401" ]; then broken="$broken /health without a key answered $fn, not 401 (functions are not answering as built);"; fi
              kept=$(curl -sS -o kept.json -w '%{http_code}' "$SITE/.netlify/functions/keep?code=AAAAAAAA" || echo 000)
              if [ "$kept" != "404" ] || ! jq -e '.error == "not_found"' kept.json > /dev/null 2>&1; then broken="$broken a restore of an unused code answered $kept (storage or the keep route is broken);"; fi
              rm -f page.html kept.json
              if [ -n "$broken" ]; then
                echo "::error::$WANT is live and broken:$broken Roll back: Netlify → Deploys → the last green deploy → Publish deploy. docs/DEPLOY.md, 'Rolling back'."
                echo "**Live, and broken:**$broken Roll back — docs/DEPLOY.md, “Rolling back”." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              echo "The page, the functions and storage all answer." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error::After fifteen minutes $SITE still serves ${live:-nothing readable}, not $WANT. The Netlify deploy log says why — docs/OPS.md, 'Did a deployment fail?'"
          echo "## Not deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Live: \`${live:-unknown}\`. Expected: \`$WANT\`. See the Netlify deploy log." >> "$GITHUB_STEP_SUMMARY"
          exit 1

# The founder's smoke alarm, on a clock (docs/OPS.md).
#
# Nothing in this product ran on a schedule: the safety queue was read when
# someone remembered to open /safety, and the backup existed when someone
# remembered to curl /export (docs/OPS.md). GitHub emails the owner when a
# workflow fails, and this repository already runs one — so a job that fails
# is the alert, and it adds no vendor (docs/DECISIONS.md, docs/OPS.md).
#
# The health job, every three hours. From outside, it asks whether the app is
# up (the page and /version.json answer). Then it reads /health with the
# founder's key — storage, server errors, Claude, spend, caps, the safety
# queue, the backup, the sweep, crashes on phones — and writes every check to
# the run's summary as a table. That summary is the dashboard: one page in the
# Actions tab, readable on a phone. A failing check fails the job, and so
# emails the founder, on its own cadence: a broken key or a storage outage on
# the next run; an urgent report (threats, or something explicit) in the
# 09:00 run; anything open, a stale backup or a stalled sweep only in
# Monday's 09:00 run — so one old report does not send eight emails a day.
# It prints counts and sentences, never a report, a code or anything of a
# member's. Until FOUNDER_KEY exists as a repository secret the read is a 401
# and the job fails, which is the prompt to add it (docs/OPS.md).
#
# The monthly job saves /export as a 35-day artifact — one month and a margin,
# since each run replaces the last (docs/PRIVACY.md, R5). It runs only when the
# repository variable BACKUP_TO_ARTIFACT is "true": the export holds
# pseudonymous learning records, and an artifact on a public repository can be
# downloaded by anyone signed in to GitHub. Flip the repository private first
# (docs/DECISIONS.md action 5), then set the variable. Either way /health says how
# long it has been since /export last answered — a backup taken by hand counts.
name: watch

on:
  schedule:
    # Every three hours, on the hour UTC — the health check. The 09:00 run is
    # the daily one, and Monday's 09:00 run the weekly one.
    - cron: '0 */3 * * *'
    # The first of the month, 09:30 UTC — the backup.
    - cron: '30 9 1 * *'
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run by hand
        type: choice
        options: [health, backup]
        default: health

env:
  SITE: ${{ vars.SITE_URL || 'https://joinniyyah.com' }}

# The token every job gets reads the repository and nothing else. Neither
# workflow writes to it; an artifact upload does not need it (docs/SECURITY.md,
# O10).
permissions:
  contents: read

jobs:
  health:
    if: github.event.schedule == '0 */3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'health')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Is the app up, and how is it?
        env:
          FOUNDER_KEY: ${{ secrets.FOUNDER_KEY }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -u
          hour=$(date -u +%H)
          dow=$(date -u +%u)
          daily=false; weekly=false
          if [ "$MANUAL" = "true" ] || [ "$hour" = "09" ]; then daily=true; fi
          if [ "$MANUAL" = "true" ] || { [ "$hour" = "09" ] && [ "$dow" = "1" ]; }; then weekly=true; fi
          summary="$GITHUB_STEP_SUMMARY"
          echo "## Niyyah, $(date -u +'%Y-%m-%d %H:00') UTC" >> "$summary"
          down=0

          # Is the app up? The page, and the file the build writes.
          page=$(curl -sS -o page.html -w '%{http_code}' "$SITE/" || echo 000)
          if [ "$page" != "200" ] || ! grep -q 'id="root"' page.html; then
            echo "::error::$SITE/ answered $page, or not with the app. Is the app up? No."
            echo "| 🔴 | Is the app up? | $SITE/ answered $page. |" >> "$summary"
            down=1
          fi
          version=$(curl -sS "$SITE/version.json" | jq -r '.commit // empty' 2>/dev/null || true)
          rm -f page.html

          if [ -z "$FOUNDER_KEY" ]; then
            echo "::error::FOUNDER_KEY is not a repository secret — add it (Settings → Secrets → Actions) so this check can read /health. docs/OPS.md"
            exit 1
          fi
          status=$(curl -sS -o health.json -w '%{http_code}' -H "Authorization: Bearer $FOUNDER_KEY" "$SITE/.netlify/functions/health" || echo 000)
          if [ "$status" != "200" ]; then
            echo "::error::/health answered $status — functions are down, or the key is wrong. docs/OPS.md"
            echo "| 🔴 | Are functions up? | /health answered $status. |" >> "$summary"
            exit 1
          fi

          {
            echo ""
            [ "$down" = "0" ] && echo "The app is up; the live commit is \`${version:-unknown}\`."
            echo ""
            echo "| | Question | Now |"
            echo "|---|---|---|"
            jq -r '.checks[] | "| \(if .state == "ok" then "🟢" elif .state == "warn" then "🟡" else "🔴" end) | \(.question) | \(.summary) |"' health.json
            echo ""
            echo "Seven days of counts: \`curl -H \"Authorization: Bearer \$FOUNDER_KEY\" $SITE/.netlify/functions/health | jq .days\` — docs/OPS.md says what each one means."
          } >> "$summary"

          # Fail — and so email — on each check's own cadence.
          alarms=$(jq -r --argjson daily "$daily" --argjson weekly "$weekly" '
            .checks[] | select(.state == "fail")
            | select(.cadence == "now" or (.cadence == "daily" and $daily) or (.cadence == "weekly" and $weekly))
            | "\(.question) \(.summary)"' health.json)
          rm -f health.json
          if [ -n "$alarms" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$alarms"
            exit 1
          fi
          if [ "$down" != "0" ]; then exit 1; fi
          echo "Nothing that cannot wait."

  backup:
    if: (github.event.schedule == '30 9 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'backup')) && vars.BACKUP_TO_ARTIFACT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Save the learning record
        env:
          FOUNDER_KEY: ${{ secrets.FOUNDER_KEY }}
        run: |
          set -u
          if [ -z "$FOUNDER_KEY" ]; then
            echo "::error::FOUNDER_KEY is not a repository secret. docs/OPS.md"
            exit 1
          fi
          name="niyyah-backup-$(date -u +%F).json"
          status=$(curl -sS -o "$name" -w '%{http_code}' -H "Authorization: Bearer $FOUNDER_KEY" "$SITE/.netlify/functions/export")
          if [ "$status" != "200" ]; then
            echo "::error::/export answered $status — no backup was taken this month."
            exit 1
          fi
          jq -e '.version' "$name" > /dev/null
          echo "name=$name" >> "$GITHUB_OUTPUT"
        id: save
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.save.outputs.name }}
          path: ${{ steps.save.outputs.name }}
          retention-days: 35
          if-no-files-found: error

# The quality gate, ours rather than the host's.
#
# `main` deploys itself the moment a pull request merges, and until this file
# existed nothing ran the tests before that happened — the only thing standing
# between a mistake and every member was whoever remembered to look. Netlify
# builds the site, but a build is not a check: `npm run build` runs `tsc -b`
# and would catch a type error, and nothing else.
#
# It also belongs to us. If the host ever changes, the gate leaves with the
# repository, which is the whole point of docs/CONTROL.md.
name: verify

on:
  pull_request:
  push:
    branches: [main]

# A second push supersedes the first; no point finishing a run for a commit
# nobody will deploy.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# The token every job gets reads the repository and nothing else. Neither
# workflow writes to it; an artifact upload does not need it (docs/SECURITY.md,
# O10).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches NODE_VERSION in netlify.toml. If one moves, move both.
          node-version: '22'
          cache: npm

      - run: npm ci

      # Typecheck, lint and the whole suite — the same command a contributor
      # runs locally, so a green tick here means exactly what it means there.
      - run: npm run verify

      # The build is part of the gate too: a deploy that cannot build is a
      # site that silently keeps serving last week.
      - run: npm run build
